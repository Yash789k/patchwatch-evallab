name: Sandbox and evaluation regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evaluation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: false
          version: '0.11.26'
      - run: uv sync --frozen --python 3.12
      - run: uv run python -m patchwatch.cli setup
      - run: uv run python -m pytest -q -m docker
      - run: uv run python -m patchwatch.cli eval --output artifacts/eval
      - run: uv run python -m patchwatch.cli eval compare --baseline evallab/baseline.json --candidate artifacts/eval/evaluation.json
      - name: Job summary
        if: always()
        run: |
          if test -f artifacts/eval/evaluation.md; then cat artifacts/eval/evaluation.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evallab-evidence
          path: artifacts/eval
          retention-days: 1
          if-no-files-found: warn
